# TriShield Default Scenario: 5 UAV Drones, 1 victim.

name: trishield_default
bounds: [25.0, 25.0, 20.0]  # Half-extents [x, y, z]

drone_configs:
  - id: UAV_1
    type: uav
    spawn: [0.0, 0.0, 10.0]
  - id: UAV_2
    type: uav
    spawn: [5.0, -5.0, 12.0]
  - id: UAV_3
    type: uav
    spawn: [-5.0, 5.0, 8.0]
  - id: UAV_4
    type: uav
    spawn: [10.0, 10.0, 10.0]
  - id: UAV_5
    type: uav
    spawn: [-10.0, -10.0, 10.0]

obstacles:
  - name: Central NFZ
    position: [0.0, 10.0, 5.0]
    radius: 5.0
    obstacle_type: no_fly_zone
  - name: Southern NFZ
    position: [-10.0, -5.0, 0.0]
    radius: 8.0
    obstacle_type: no_fly_zone

threats: []

victims:
  - id: Survivor
    pos: [-15.0, 15.0, 2.0]
    urgency: 10

restricted_zones:
  - pos: [0.0, 10.0, 5.0]
    radius: 5.0
  - pos: [-10.0, -5.0, 0.0]
    radius: 8.0

wind_vector: [0.5, 0.2, 0.0]
max_steps: 500
dt: 0.1
camera_resolution: [84, 84]
